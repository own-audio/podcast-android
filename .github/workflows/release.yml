name: Release

# A tag v* builds the release APKs of both flavours and the play bundle, numbered by the commit
# count, and attaches the foss APK and the bundle to the tag's GitHub release. Signed only when
# the four ANDROID_* repository secrets exist; otherwise everything is built unsigned. See
# docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: building unsigned."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # app/build.gradle.kts reads keystore.properties from the root (gitignored).
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          code=$(git rev-list --count HEAD)
          echo "versionCode $code"
          ./gradlew assemblePlayRelease assembleFossRelease bundlePlayRelease -Papp.versionCode="$code"

      - name: APK size
        run: tools/apk-size.sh

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(sed -n 's/^app.id=//p' gradle.properties)
          mkdir -p out
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            case "$apk" in *-unsigned.apk) suffix=-unsigned ;; *) suffix= ;; esac
            cp "$apk" "out/$id-$TAG-foss$suffix.apk"
          done
          cp app/build/outputs/bundle/playRelease/*.aab "out/$id-$TAG-play.aab"
          (cd out && sha256sum * > SHA256SUMS)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" out/* --clobber
