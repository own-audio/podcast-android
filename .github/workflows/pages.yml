name: Guide

# Publishes guide/ (the user guide) to GitHub Pages. Only guide/ is built: docs/ holds plans and
# notes for developers, not pages for users.
# Run by hand until GitHub Pages is switched on for the repository (Settings → Pages → Source:
# GitHub Actions); then add back `push: branches: [main], paths: [guide/**]` to publish on change.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./guide
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
