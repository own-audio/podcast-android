org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true
kotlin.code.style=official
android.useAndroidX=true
# KSP registers its sources through kotlin.sourceSets, which AGP 9's built-in Kotlin refuses by
# default; this is the suppression AGP documents (https://developer.android.com/r/tools/built-in-kotlin).
android.disallowKotlinSourceSets=false

# App identity: the only place the app's id and names are set. A fork changes these lines.
app.id=audio.own.podcastplayer
app.name=own.podcast
app.versionName=0.1.0
# Release builds pass -Papp.versionCode=$(git rev-list --count HEAD).
app.versionCode=1
